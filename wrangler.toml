
name = "animap"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# Keep one public address only (no extra per-version preview links).
workers_dev = true
preview_urls = false

# Serves the website files AND the /api routes from ONE origin (needed for the secure cookie).
[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "animap-db"
database_id = "32895096-0632-4ec2-8065-ce0e74e54155"

[[r2_buckets]]
binding = "MODELS"
bucket_name = "animap-models"